{% comment %}
Panel de una celda del cuadro: las pruebas de un instrumento para un alumno,
con sus notas y evidencias. Se carga dentro del <dialog> del cuadro.
{% endcomment %}
{% comment %}
SIN <script> aquí a propósito: este HTML entra por innerHTML en el cuadro, y el
navegador NO ejecuta los scripts que llegan así. La lógica vive en cuadro.html
(`initPanel`) y lee lo que necesita de los data-* de este root.
{% endcomment %}
<div id="panel-root" data-alumno="{{ alumno.pk }}">
<div class="flex justify-between items-start gap-2">
  <div>
    <h3 class="font-bold text-lg">{{ instrumento.nombre }} <span class="opacity-60 font-normal">· {{ instrumento.peso|floatformat:"-2" }} %</span></h3>
    <p class="text-sm opacity-70">{{ alumno.name|default:alumno.email }}</p>
  </div>
  <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost">✕</button></form>
</div>

<table class="table table-sm mt-3">
  <thead><tr><th>Prueba</th><th>Fecha</th><th class="text-center">Nota</th></tr></thead>
  <tbody>
    {% for prueba, nota in filas %}
    <tr>
      <td>{{ prueba.nombre }}{% if not prueba.activa %} <span class="badge badge-ghost badge-xs">inactiva</span>{% endif %}</td>
      <td class="whitespace-nowrap">{{ prueba.fecha|date:"d/m/Y" }}</td>
      <td class="text-center">
        {% if opciones %}
          <select class="select select-bordered select-xs w-28 nota-panel" data-prueba="{{ prueba.pk }}">
            <option value="">—</option>
            {% for o in opciones %}<option value="{{ o.valor|floatformat:'-2' }}" {% if nota and nota.valor is not None and nota.valor == o.valor %}selected{% endif %}>{{ o.etiqueta }} ({{ o.valor|floatformat:'-2' }})</option>{% endfor %}
          </select>
        {% else %}
          <input type="text" inputmode="decimal" class="input input-bordered input-xs w-16 text-center nota-panel" data-prueba="{{ prueba.pk }}" value="{% if nota and nota.valor is not None %}{{ nota.valor|floatformat:'-2' }}{% endif %}" />
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<form method="post" action="{% url 'calificaciones:prueba_crear' instrumento.pk %}" class="flex gap-2 items-end mt-2">
  {% csrf_token %}
  <input type="hidden" name="next" value="{% url 'calificaciones:cuadro' group.pk %}?t={{ instrumento.plan.trimestre }}" />
  <label class="form-control flex-1"><span class="label-text text-xs">Nueva prueba de este instrumento (para todo el grupo)</span>
    <input name="nombre" class="input input-bordered input-sm" placeholder="{{ instrumento.nombre }} {{ filas|length|add:1 }}" /></label>
  <input type="date" name="fecha" class="input input-bordered input-sm" />
  <button class="btn btn-sm btn-outline">＋ Prueba</button>
</form>

<div class="divider my-2">Evidencias</div>

<div id="panel-evidencias" class="space-y-2">
  {% include "calificaciones/partials/evidencias.html" with evidencias=evidencias %}
</div>

<form id="panel-evidencia-form" class="mt-3 flex flex-wrap gap-2 items-center" enctype="multipart/form-data" onsubmit="return false;">
  {% csrf_token %}
  <input type="hidden" name="alumno" value="{{ alumno.pk }}" />
  <select name="prueba" class="select select-bordered select-sm">
    {% for prueba, nota in filas %}<option value="{{ prueba.pk }}">{{ prueba.nombre }}</option>{% endfor %}
  </select>
  <label class="btn btn-sm btn-outline">📷 Foto<input type="file" name="foto" accept="image/*" capture="environment" class="hidden" /></label>
  <label class="btn btn-sm btn-outline">📁 Archivo<input type="file" name="archivo" class="hidden" /></label>
  <input name="texto" class="input input-bordered input-sm flex-1 min-w-40" placeholder="Nota de texto o enlace…" />
  <button type="submit" class="btn btn-sm btn-primary">✏️ Añadir</button>
</form>
</div>
