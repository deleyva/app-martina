server {
  listen       80;
  server_name  localhost;
  client_max_body_size 500M;

  # Las notas de voz de las reflexiones de clase NO salen por aquí.
  #
  # nginx entrega /media/ tal cual, sin pasar por Django, así que cualquiera con
  # la URL se baja el fichero; y el nombre era adivinable, porque llevaba dentro
  # el id de la sesión, que el alumnado tiene en su propia barra de direcciones.
  # Una reflexión de clase puede hablar de un alumno con nombre y apellidos.
  #
  # Se sirven por `clases:class_session_reflection_audio`, que comprueba que
  # quien la pide es el profesor que la grabó. `^~` para que esta regla gane a
  # la de abajo, y 404 en vez de 403 para no confirmar ni que existe.
  location ^~ /media/class_reflections/ {
    return 404;
  }

  # Las evidencias de calificaciones (fotos, audio y vídeo de alumnado menor
  # de edad) tampoco: las sirve `calificaciones:evidencia_ver`, que exige ser
  # profesor del grupo. Mismo 404 para no confirmar ni que existen.
  location ^~ /media/calificaciones/ {
    return 404;
  }

  # Servir archivos estáticos y media
  location /media/ {
    alias /usr/share/nginx/media/;
  }

  # Redirigir todas las demás solicitudes a Django
  location / {
    proxy_pass http://django:5000;
    
    # 1. Pasamos el Host exacto que manda NPM
    proxy_set_header Host $http_host; 
    
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # 2. Pasamos el protocolo original (HTTPS) que envía NPM, sin sobrescribirlo
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; 

    # Aumentar timeouts (ej. 5 minutos)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
  }
}
