{% load static i18n %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}Incidencias IES Martina Bescós{% endblock title %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="{% static 'images/favicons/favicon.ico' %}" sizes="32x32" />
    <link href="{% static 'css/output.css' %}" rel="stylesheet" />
    <style>
      @media print {
        .no-print { display: none !important; }
        details { display: block; }
        details > summary { display: none; }
        .card { break-inside: avoid; box-shadow: none !important; border: 1px solid #ddd; }
        body { font-size: 12px; }
      }
    </style>
    {% block extra_css %}{% endblock extra_css %}
  </head>
  <body class="min-h-screen bg-base-200">
    <div class="container mx-auto px-4 py-6 max-w-5xl">
      {% block content %}{% endblock content %}
    </div>
    <footer class="text-center text-xs opacity-60 py-6 no-print">IES Martina Bescós · apps.iesmartinabescos.es/incidencias/</footer>
  </body>
</html>
