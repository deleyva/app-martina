volumes:
  martina_bescos_app_local_whisper_modelos: {}
  martina_bescos_app_local_postgres_data: {}
  martina_bescos_app_local_meilisearch_data: {}
  

services:
  django: &django-base
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: martina_bescos_app_local_django
    container_name: martina_bescos_app_local_django
    depends_on:
      - postgres
      - mailpit
      - redis
    volumes:
      - .:/app:z
      - ./backups:/backups
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    environment:
      - BACKUP_ENV=local
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: martina_bescos_app_production_postgres
    container_name: martina_bescos_app_local_postgres
    volumes:
      - martina_bescos_app_local_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    environment:
      - BACKUP_ENV=local

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: martina_bescos_app_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:6
    container_name: martina_bescos_app_local_redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: martina_bescos_app_local_meilisearch
    ports:
      - "7700:7700"
    volumes:
      - martina_bescos_app_local_meilisearch_data:/meili_data
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true

  # Transcribe las notas de voz de clase (fase 40·1). Aparte y con tope de
  # memoria: el servidor no tiene swap, y si Whisper se pasa tiene que morir
  # él y no Postgres. Sin puertos publicados ni volumen de medios: solo ve
  # los bytes que le manda la tarea de Huey.
  whisper:
    build:
      context: ./compose/production/whisper
    image: martina_bescos_app_local_whisper
    container_name: martina_bescos_app_local_whisper
    restart: unless-stopped
    mem_limit: 900m
    memswap_limit: 900m
    volumes:
      - martina_bescos_app_local_whisper_modelos:/modelos

  huey_consumer:
    <<: *django-base
    image: martina_bescos_app_local_django
    container_name: martina_bescos_app_local_huey_consumer
    depends_on:
      - postgres
      - redis
    ports: []
    command: /app/compose/local/django/start-huey
    environment:
      - DJANGO_HUEY_IMMEDIATE=False
